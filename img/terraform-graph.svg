<svg xmlns="http://www.w3.org/2000/svg" viewBox="75 8 810 336" width="810" height="336" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrowDag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="75" y="8" width="810" height="336" rx="16" fill="#f8fafc"/>

  <!-- Level 1 (Top): Dependent Compute Resource (Created 3rd) -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="18" width="340" height="54" rx="14" fill="#0f172a"/>
    <text x="480" y="42" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#38bdf8">aws_instance.frontend (Created 3rd)</text>
    <text x="480" y="60" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Depends on Subnet &amp; Security Group</text>
  </g>

  <!-- Dependency Edges from Instance -> Subnet & SG -->
  <line x1="400" y1="72" x2="250" y2="112" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>
  <line x1="560" y1="72" x2="710" y2="112" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>

  <!-- Level 2 (Middle): Parallel Resources (Created 2nd in parallel) -->
  <g filter="url(#cardShadow)">
    <rect x="95" y="118" width="310" height="54" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="142" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">aws_subnet.public["a"]</text>
    <text x="250" y="160" text-anchor="middle" font-size="10.5" fill="#059669" font-weight="700">Created 2nd (Parallel Execution)</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="555" y="118" width="310" height="54" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <text x="710" y="142" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#4338ca">aws_security_group.web</text>
    <text x="710" y="160" text-anchor="middle" font-size="10.5" fill="#059669" font-weight="700">Created 2nd (Parallel Execution)</text>
  </g>

  <!-- Dependency Edges from Subnet & SG -> VPC -->
  <line x1="250" y1="172" x2="400" y2="214" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>
  <line x1="710" y1="172" x2="560" y2="214" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>

  <!-- Level 3 (Bottom): Foundation VPC & Provider (Created 1st) -->
  <g filter="url(#cardShadow)">
    <rect x="295" y="220" width="370" height="54" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="480" y="244" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#047857">aws_vpc.main (Created 1st)</text>
    <text x="480" y="262" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#065f46">provider["registry.terraform.io/hashicorp/aws"]</text>
  </g>

  <!-- Bottom note -->
  <rect x="95" y="292" width="770" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Directed Acyclic Graph (<tspan font-family="'JetBrains Mono', monospace" font-weight="700" fill="#4f46e5">DAG</tspan>): Arrows show dependency direction; Terraform provisions bottom-up in parallel</text>
</svg>
