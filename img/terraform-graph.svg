<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrowDag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="350" rx="16" fill="#f8fafc"/>

  <!-- Root node -->
  <g filter="url(#cardShadow)">
    <rect x="295" y="20" width="370" height="44" rx="22" fill="#0f172a"/>
    <text x="480" y="47" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">[root] provider["registry.terraform.io/hashicorp/aws"]</text>
  </g>

  <!-- Edges from root -->
  <line x1="410" y1="64" x2="250" y2="108" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>
  <line x1="550" y1="64" x2="710" y2="108" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>

  <!-- Level 2 nodes -->
  <g filter="url(#cardShadow)">
    <rect x="105" y="114" width="290" height="54" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="138" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">aws_instance.frontend</text>
    <text x="250" y="156" text-anchor="middle" font-size="10.5" fill="#64748b">Depends on Subnet &amp; Security Group</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="565" y="114" width="290" height="54" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <text x="710" y="138" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#4338ca">aws_security_group.web</text>
    <text x="710" y="156" text-anchor="middle" font-size="10.5" fill="#64748b">Depends on VPC</text>
  </g>

  <!-- Edges to Level 3 -->
  <line x1="250" y1="168" x2="250" y2="212" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>
  <line x1="350" y1="168" x2="620" y2="212" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>
  <line x1="710" y1="168" x2="710" y2="212" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>

  <!-- Level 3 nodes -->
  <g filter="url(#cardShadow)">
    <rect x="105" y="218" width="290" height="52" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="250" y="249" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1e40af">aws_subnet.public</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="565" y="218" width="290" height="52" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="710" y="249" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#047857">aws_vpc.main (Created 1st)</text>
  </g>

  <!-- Edge Subnet -> VPC -->
  <line x1="395" y1="244" x2="557" y2="244" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowDag)"/>

  <!-- Bottom note -->
  <rect x="105" y="290" width="750" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Directed Acyclic Graph (<tspan font-family="'JetBrains Mono', monospace" font-weight="700" fill="#4f46e5">DAG</tspan>): Independent nodes (<tspan font-family="'JetBrains Mono', monospace" fill="#1d4ed8">aws_subnet</tspan> &amp; <tspan font-family="'JetBrains Mono', monospace" fill="#4338ca">aws_security_group</tspan>) are provisioned in parallel</text>
</svg>
