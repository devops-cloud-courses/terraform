<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="390" rx="16" fill="#f8fafc"/>

  <!-- Left: HCL Config & Lockfile -->
  <g filter="url(#cardShadow)">
    <rect x="28" y="65" width="215" height="260" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="46" y="86" width="179" height="36" rx="8" fill="#eff6ff"/>
    <text x="135" y="109" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">*.tf Configuration</text>
    <text x="135" y="146" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Declarative HCL</text>
    <text x="135" y="168" text-anchor="middle" font-size="12" fill="#64748b">Resources, Data Sources,</text>
    <text x="135" y="186" text-anchor="middle" font-size="12" fill="#64748b">Ephemeral &amp; Modules</text>

    <rect x="46" y="208" width="179" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="135" y="227" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">.terraform.lock.hcl</text>
    <text x="135" y="243" text-anchor="middle" font-size="10.5" fill="#64748b">SHA-256 Provider Hashes</text>

    <rect x="46" y="264" width="179" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="135" y="289" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#3730a3">terraform.tfstate</text>
  </g>

  <!-- Arrow Config -> Core -->
  <line x1="248" y1="195" x2="296" y2="195" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Center: Terraform Core + Provider Plugins -->
  <g filter="url(#cardShadow)">
    <rect x="306" y="38" width="288" height="314" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="328" y="58" width="244" height="62" rx="12" fill="url(#coreGrad)"/>
    <text x="450" y="86" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Terraform Core (v1.17)</text>
    <text x="450" y="106" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#dbeafe">CLI · Graph Builder · State Diff</text>

    <line x1="450" y1="122" x2="450" y2="156" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="4 3"/>
    <rect x="366" y="129" width="168" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="450" y="144" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">gRPC Plugin Protocol v6</text>

    <rect x="328" y="160" width="244" height="170" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="450" y="185" text-anchor="middle" font-size="15" font-weight="800" fill="#312e81">Provider Plugins</text>
    <text x="450" y="204" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#4338ca">registry.terraform.io</text>

    <rect x="342" y="218" width="104" height="42" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="394" y="236" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#3730a3">hashicorp/aws</text>
    <text x="394" y="252" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#059669">~&gt; 6.70</text>

    <rect x="454" y="218" width="104" height="42" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="506" y="236" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#3730a3">hashicorp/google</text>
    <text x="506" y="252" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#059669">~&gt; 6.0</text>

    <rect x="342" y="268" width="104" height="42" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="394" y="286" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#3730a3">kubernetes</text>
    <text x="394" y="302" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#64748b">~&gt; 2.35</text>

    <rect x="454" y="268" width="104" height="42" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="506" y="286" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#3730a3">4,000+ others</text>
    <text x="506" y="302" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#64748b">Official &amp; Partner</text>
  </g>

  <!-- Arrows Providers -> Target APIs -->
  <line x1="598" y1="105" x2="674" y2="82" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>
  <line x1="598" y1="195" x2="674" y2="195" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>
  <line x1="598" y1="285" x2="674" y2="308" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>

  <rect x="604" y="167" width="66" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="637" y="182" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">HTTPS CRUD</text>

  <!-- Right: Target Cloud & SaaS APIs -->
  <g filter="url(#cardShadow)">
    <rect x="684" y="38" width="248" height="90" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="704" y="68" font-size="15" font-weight="800" fill="#0f172a">Hyperscalers &amp; Clouds</text>
    <text x="704" y="92" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#2563eb">AWS · GCP · Azure · OCI · OVH</text>
    <text x="704" y="112" font-size="11" fill="#64748b">VPCs, Compute, IAM, Managed DBs</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="684" y="150" width="248" height="90" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="704" y="180" font-size="15" font-weight="800" fill="#0f172a">Cloud-Native &amp; Security</text>
    <text x="704" y="204" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#4f46e5">Kubernetes · Helm · Vault · TLS</text>
    <text x="704" y="224" font-size="11" fill="#64748b">Workloads, Secrets, Certificates</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="684" y="262" width="248" height="90" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <text x="704" y="292" font-size="15" font-weight="800" fill="#0f172a">SaaS, Edge &amp; Observability</text>
    <text x="704" y="316" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#059669">GitHub · Cloudflare · Datadog</text>
    <text x="704" y="336" font-size="11" fill="#64748b">Repos, DNS/WAF, Dashboards, Alerts</text>
  </g>
</svg>
