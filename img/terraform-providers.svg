<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="380" rx="16" fill="#f8fafc"/>

  <!-- Left: HCL Config -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="100" width="190" height="180" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="50" y="122" width="150" height="32" rx="8" fill="#eff6ff"/>
    <text x="125" y="143" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">*.tf Files (HCL)</text>
    <text x="125" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Declarative Config</text>
    <text x="125" y="206" text-anchor="middle" font-size="12" fill="#64748b">Resources, Modules,</text>
    <text x="125" y="224" text-anchor="middle" font-size="12" fill="#64748b">Variables &amp; Outputs</text>
    <rect x="55" y="238" width="140" height="24" rx="6" fill="#f1f5f9"/>
    <text x="125" y="254" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#475569">terraform.tfstate</text>
  </g>

  <!-- Arrow Config -> Core -->
  <line x1="226" y1="190" x2="278" y2="190" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Center: Terraform Core + Provider Plugins -->
  <g filter="url(#cardShadow)">
    <rect x="288" y="55" width="270" height="270" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="312" y="78" width="222" height="58" rx="12" fill="url(#coreGrad)"/>
    <text x="423" y="105" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Terraform Core</text>
    <text x="423" y="124" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#dbeafe">Graph · Diff · State Engine</text>

    <line x1="423" y1="138" x2="423" y2="165" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="423" y="156" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#4f46e5">gRPC Plugin Protocol</text>

    <rect x="312" y="170" width="222" height="132" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="423" y="195" text-anchor="middle" font-size="15" font-weight="800" fill="#312e81">Provider Plugins</text>
    <text x="423" y="216" text-anchor="middle" font-size="12" fill="#4338ca">Translate HCL into CRUD APIs</text>

    <rect x="328" y="230" width="88" height="26" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="372" y="247" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#3730a3">hashicorp/aws</text>

    <rect x="428" y="230" width="90" height="26" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="473" y="247" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#3730a3">hashicorp/google</text>

    <rect x="328" y="264" width="88" height="26" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="372" y="281" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#3730a3">kubernetes</text>

    <rect x="428" y="264" width="90" height="26" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="473" y="281" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#3730a3">4,000+ others</text>
  </g>

  <!-- Arrows Providers -> Target APIs -->
  <line x1="564" y1="110" x2="646" y2="85" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>
  <line x1="564" y1="190" x2="646" y2="190" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>
  <line x1="564" y1="270" x2="646" y2="295" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>

  <rect x="572" y="162" width="66" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="605" y="177" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">HTTPS CRUD</text>

  <!-- Right: Target Cloud & SaaS APIs -->
  <g filter="url(#cardShadow)">
    <rect x="656" y="42" width="234" height="82" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="676" y="72" font-size="15" font-weight="800" fill="#0f172a">Public &amp; Private Clouds</text>
    <text x="676" y="96" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">AWS · GCP · Azure · OVH · OpenStack</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="656" y="149" width="234" height="82" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="676" y="179" font-size="15" font-weight="800" fill="#0f172a">Containers &amp; Platform</text>
    <text x="676" y="203" font-size="12" font-family="'JetBrains Mono', monospace" fill="#4f46e5">Kubernetes · Helm · Docker · Vault</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="656" y="256" width="234" height="82" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="676" y="286" font-size="15" font-weight="800" fill="#0f172a">SaaS, Data &amp; DevOps</text>
    <text x="676" y="310" font-size="12" font-family="'JetBrains Mono', monospace" fill="#059669">GitHub · GitLab · Datadog · Postgres</text>
  </g>
</svg>
