<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 12 936 318" width="936" height="318" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="lyrNet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lyrData" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="lyrApp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="lyrArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="lyrShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="936" height="318" rx="16" fill="#f8fafc"/>

  <!-- Layer 1: 01-network -->
  <g filter="url(#lyrShadow)">
    <rect x="24" y="24" width="276" height="226" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="24" y="24" width="276" height="44" rx="14" fill="url(#lyrNet)"/>
    <text x="162" y="51" text-anchor="middle" font-size="14.5" font-weight="800" fill="#ffffff">Layer 1: 01-network</text>

    <rect x="42" y="84" width="240" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="162" y="106" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">prod/01-network/terraform.tfstate</text>

    <text x="162" y="142" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">VPC · Subnets · NAT · Transit GW</text>
    <text x="162" y="164" text-anchor="middle" font-size="11.5" fill="#475569">Owner: Network / Cloud Foundation</text>

    <rect x="42" y="182" width="240" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="162" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Change Frequency: Low (Monthly)</text>
    <text x="162" y="221" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#059669">Exports: vpc_id, subnet_ids via SSM</text>
  </g>

  <line x1="306" y1="137" x2="334" y2="137" stroke="#475569" stroke-width="2.5" marker-end="url(#lyrArrow)"/>

  <!-- Layer 2: 02-data -->
  <g filter="url(#lyrShadow)">
    <rect x="342" y="24" width="276" height="226" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <rect x="342" y="24" width="276" height="44" rx="14" fill="url(#lyrData)"/>
    <text x="480" y="51" text-anchor="middle" font-size="14.5" font-weight="800" fill="#ffffff">Layer 2: 02-data (Stateful)</text>

    <rect x="360" y="84" width="240" height="34" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="480" y="106" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#5b21b6">prod/02-data/terraform.tfstate</text>

    <text x="480" y="142" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">RDS · S3 Buckets · KMS · Redis</text>
    <text x="480" y="164" text-anchor="middle" font-size="11.5" fill="#475569">Owner: Data &amp; Security Platform</text>

    <rect x="360" y="182" width="240" height="50" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="480" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Guardrail: prevent_destroy = true</text>
    <text x="480" y="221" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#dc2626">password_wo (ephemeral secrets)</text>
  </g>

  <line x1="624" y1="137" x2="652" y2="137" stroke="#475569" stroke-width="2.5" marker-end="url(#lyrArrow)"/>

  <!-- Layer 3: 03-compute -->
  <g filter="url(#lyrShadow)">
    <rect x="660" y="24" width="276" height="226" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="660" y="24" width="276" height="44" rx="14" fill="url(#lyrApp)"/>
    <text x="798" y="51" text-anchor="middle" font-size="14.5" font-weight="800" fill="#ffffff">Layer 3: 03-compute</text>

    <rect x="678" y="84" width="240" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="798" y="106" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#047857">prod/03-compute/terraform.tfstate</text>

    <text x="798" y="142" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">EKS · ECS · Lambda · API GW</text>
    <text x="798" y="164" text-anchor="middle" font-size="11.5" fill="#475569">Owner: Product &amp; App Teams</text>

    <rect x="678" y="182" width="240" height="50" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="798" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Change Frequency: High (Daily CI/CD)</text>
    <text x="798" y="221" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#047857">Fast plans · Minimal blast radius</text>
  </g>

  <!-- Bottom Environment Isolation Bar -->
  <g filter="url(#lyrShadow)">
    <rect x="24" y="268" width="912" height="50" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="38" y="278" width="224" height="30" rx="8" fill="#0f172a"/>
    <text x="150" y="298" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">DIRECTORY ISOLATION</text>
    <text x="282" y="298" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">envs/dev/</text>
    <text x="358" y="298" font-size="12" fill="#475569">(Sandbox AWS Account)</text>
    <text x="515" y="298" font-size="12" fill="#94a3b8">vs.</text>
    <text x="545" y="298" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#059669">envs/prod/</text>
    <text x="625" y="298" font-size="12" fill="#475569">(Prod AWS Account + Dedicated IAM Role &amp; State Bucket)</text>
  </g>
</svg>
