<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="step1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="step2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="step3Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="320" rx="16" fill="#f8fafc"/>

  <!-- Step 1: Write -->
  <g filter="url(#cardShadow)">
    <rect x="35" y="40" width="245" height="240" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="59" y="64" width="48" height="48" rx="12" fill="url(#step1Grad)"/>
    <text x="83" y="95" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
    <text x="121" y="84" font-size="20" font-weight="800" fill="#0f172a">Write</text>
    <text x="121" y="104" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#2563eb">main.tf (HCL)</text>

    <rect x="59" y="130" width="197" height="72" rx="10" fill="#0f172a"/>
    <text x="73" y="154" font-size="11" font-family="'JetBrains Mono', monospace" fill="#93c5fd">resource "aws_s3_bucket" {</text>
    <text x="73" y="172" font-size="11" font-family="'JetBrains Mono', monospace" fill="#e2e8f0">  bucket = "app-assets"</text>
    <text x="73" y="190" font-size="11" font-family="'JetBrains Mono', monospace" fill="#93c5fd">}</text>

    <text x="157" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Author declarative IaC</text>
    <text x="157" y="252" text-anchor="middle" font-size="12" fill="#64748b">Versioned in Git</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="288" y1="160" x2="328" y2="160" stroke="#64748b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrowFlow)"/>

  <!-- Step 2: Plan -->
  <g filter="url(#cardShadow)">
    <rect x="338" y="40" width="245" height="240" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="362" y="64" width="48" height="48" rx="12" fill="url(#step2Grad)"/>
    <text x="386" y="95" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
    <text x="424" y="84" font-size="20" font-weight="800" fill="#0f172a">Plan</text>
    <text x="424" y="104" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#4f46e5">terraform plan</text>

    <rect x="362" y="130" width="197" height="72" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="378" y="153" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#16a34a">+ create  aws_s3_bucket</text>
    <text x="378" y="172" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#d97706">~ update  aws_iam_role</text>
    <text x="378" y="191" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#dc2626">- destroy aws_instance</text>

    <text x="460" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Preview execution plan</text>
    <text x="460" y="252" text-anchor="middle" font-size="12" fill="#64748b">Diff desired vs. real state</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="591" y1="160" x2="631" y2="160" stroke="#64748b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrowFlow)"/>

  <!-- Step 3: Apply -->
  <g filter="url(#cardShadow)">
    <rect x="641" y="40" width="245" height="240" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="665" y="64" width="48" height="48" rx="12" fill="url(#step3Grad)"/>
    <text x="689" y="95" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
    <text x="727" y="84" font-size="20" font-weight="800" fill="#0f172a">Apply</text>
    <text x="727" y="104" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#059669">terraform apply</text>

    <rect x="665" y="130" width="197" height="72" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="763" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Cloud Providers API</text>
    <text x="763" y="182" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#047857">AWS · GCP · Azure · K8s</text>

    <text x="763" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Provision &amp; update state</text>
    <text x="763" y="252" text-anchor="middle" font-size="12" fill="#64748b">Reproducible across envs</text>
  </g>
</svg>
