<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 928 334" width="928" height="334" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="wfStep1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="wfStep2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="wfStep3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="wfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="wfShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="928" height="334" rx="16" fill="#f8fafc"/>

  <!-- Step 1: Write -->
  <g filter="url(#wfShadow)">
    <rect x="28" y="28" width="272" height="236" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="28" y="28" width="272" height="48" rx="16" fill="url(#wfStep1)"/>
    <text x="164" y="58" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1. Write — Author HCL</text>

    <rect x="48" y="94" width="232" height="88" rx="10" fill="#0f172a"/>
    <text x="62" y="118" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#93c5fd">resource "aws_s3_bucket" "app" {</text>
    <text x="62" y="138" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#e2e8f0">  bucket = "lgu-app-assets"</text>
    <text x="62" y="158" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#a7f3d0">  tags   = { Env = "prod" }</text>
    <text x="62" y="174" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#93c5fd">}</text>

    <text x="164" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Declarative *.tf files</text>
    <text x="164" y="232" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#2563eb">terraform fmt &amp; validate</text>
  </g>

  <line x1="306" y1="146" x2="336" y2="146" stroke="#64748b" stroke-width="3" marker-end="url(#wfArrow)"/>

  <!-- Step 2: Plan -->
  <g filter="url(#wfShadow)">
    <rect x="344" y="28" width="272" height="236" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="344" y="28" width="272" height="48" rx="16" fill="url(#wfStep2)"/>
    <text x="480" y="58" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2. Plan — Preview Diff</text>

    <rect x="364" y="94" width="232" height="88" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="380" y="118" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#16a34a">+ create   aws_s3_bucket.app</text>
    <text x="380" y="140" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#d97706">~ update   aws_iam_role.api</text>
    <text x="380" y="162" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#dc2626">- destroy  aws_instance.old</text>

    <text x="480" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Speculative Execution Plan</text>
    <text x="480" y="232" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#4f46e5">terraform plan -out=plan.out</text>
  </g>

  <line x1="622" y1="146" x2="652" y2="146" stroke="#64748b" stroke-width="3" marker-end="url(#wfArrow)"/>

  <!-- Step 3: Apply -->
  <g filter="url(#wfShadow)">
    <rect x="660" y="28" width="272" height="236" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="660" y="28" width="272" height="48" rx="16" fill="url(#wfStep3)"/>
    <text x="796" y="58" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3. Apply — Provision</text>

    <rect x="680" y="94" width="232" height="88" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="796" y="122" text-anchor="middle" font-size="13" font-weight="800" fill="#065f46">Cloud Provider CRUD APIs</text>
    <text x="796" y="145" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#047857">Apply complete! 1 added</text>
    <text x="796" y="166" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#059669">Updates state &amp; releases .tflock</text>

    <text x="796" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Converges Real Infrastructure</text>
    <text x="796" y="232" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#059669">terraform apply plan.out</text>
  </g>

  <!-- Bottom CI/CD Quality Gate Bar -->
  <g filter="url(#wfShadow)">
    <rect x="28" y="284" width="904" height="54" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="44" y="295" width="194" height="32" rx="8" fill="#1e293b"/>
    <text x="141" y="316" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">AUTOMATED GATES</text>
    <text x="258" y="316" font-size="12.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">terraform test</text>
    <text x="380" y="316" font-size="12.5" fill="#64748b">·</text>
    <text x="398" y="316" font-size="12.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#4f46e5">terraform plan -policies</text>
    <text x="605" y="316" font-size="12.5" fill="#64748b">·</text>
    <text x="622" y="316" font-size="12.5" font-weight="600" fill="#334155">PR Review + Static Scanners (<tspan font-family="'JetBrains Mono', monospace" font-weight="700" fill="#059669">tflint, trivy</tspan>)</text>
  </g>
</svg>
